bookdown::gitbook:
  css: [assets/style.css, assets/downloads.css]
  config:
    toc:
      before: |
        <li><a href="./">Visualisering_2027</a></li>
      after: |
        <li><a href="https://bookdown.org/" target="_blank" rel="noopener">Published with bookdown</a></li>
    download:
      - ["visualisation_2027.pdf", "Alle kursusnotater (PDF)"]
  includes:
    after_body: assets/downloads.html
bookdown::pdf_book:
  latex_engine: xelatex
  keep_tex: true
  toc: true
  toc_depth: 2
  includes:
    in_header: assets/pdf-preamble.tex
  pandoc_args: ["--lua-filter=assets/pdf-chapters.lua"]
